name: CI

on:
  pull_request:
  push:
    branches-ignore: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bunx biome ci
      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: bun run build
